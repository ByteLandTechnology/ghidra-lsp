name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-vscode-extension
  cancel-in-progress: false

jobs:
  publish:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and compile extension
        run: |
          npm run check
          npm run compile

      - name: Package VSIX
        run: npx --yes --package=@vscode/vsce@^4.1.1 vsce package --out ghidra-lsp.vsix

      - name: Publish to Visual Studio Marketplace via Trusted Publishing
        run: npx --yes --package=@vscode/vsce@^4.1.1 vsce publish --oidc --packagePath ghidra-lsp.vsix --skip-duplicate

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if curl -fsSL "https://open-vsx.org/api/byteland-app/ghidra-lsp/${VERSION}" 2>/dev/null | grep -q '"version"'; then
            echo "byteland-app.ghidra-lsp@${VERSION} already exists on Open VSX; skipping."
            exit 0
          fi
          npx --yes ovsx create-namespace byteland-app -p "$OVSX_PAT" || true
          npx --yes ovsx publish ghidra-lsp.vsix -p "$OVSX_PAT"
