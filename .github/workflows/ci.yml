# Continuous integration for the ghidra-lsp workspace.
#
# Builds standalone x86_64 and ARM64 executables, packages the VS Code extension,
# and publishes verified releases.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  security-audit:
    name: Security and Dependency Audit
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked --workspace check

  contrast:
    name: Webview Contrast Audit
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Typecheck and compile extension
        working-directory: editors/vscode
        run: |
          npm run check
          npm run compile

      - name: Stage headless Chromium audit tools in /tmp
        run: |
          rm -rf /tmp/ghidra-contrast
          mkdir -p /tmp/ghidra-contrast
          npm install --prefix /tmp/ghidra-contrast --no-save --no-audit --no-fund axe-core@4.10.2 playwright-core@1.52.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            npx --prefix /tmp/ghidra-contrast playwright-core install --with-deps chromium
          fi

      - name: Render snapshots and audit WCAG 2.2 AA contrast
        run: |
          cat <<'EOF' > /tmp/ghidra-contrast/audit.cjs
