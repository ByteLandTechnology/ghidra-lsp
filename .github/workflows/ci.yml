            const hexRows = [
              { rowAddress: 'ram:00401000', firstInBlockAddress: 'ram:00401000', cells: Array.from({ length: 16 }, (_, i) => ({ inBlock: true, address: `ram:0040100${i.toString(16)}`, value: i === 1 || i >= 12 ? null : 0x41 + i, symbol: i === 0 ? 'main' : undefined })) },
              { rowAddress: 'ram:00401010', firstInBlockAddress: 'ram:00401010', cells: Array.from({ length: 16 }, (_, i) => ({ inBlock: i < 14, address: i < 14 ? `ram:0040101${i.toString(16)}` : '', value: i < 8 ? 0x30 + i : null })) },
            ];
            const hexHtml = programHexUi.renderProgramHexPage({
              md5, programName: 'app.bin', title: 'Memory — app.bin', endian: 'big', addressSizeBits: 64, defaultSpace: 'ram', addressWidth: 8,
              blocks: [blockInfo, bssInfo], currentBlock: blockInfo, cursorAddress: 'ram:00401000', selectionLength: 2, cursorSymbol: 'main',
              chunk: { start: 'ram:00401000', end: 'ram:0040101d', byteLength: 30, rows: hexRows },
              hasMoreBefore: false, hasMoreAfter: true, canBack: true, canForward: true, syncEnabled: true, bytesPerRow: 16,
              initialInspector: [{ label: 'uint32', value: '1094861636', rawTitle: '0x41424344' }, { label: 'Pointer', value: '0x00401010', jumpAddress: 'ram:00401010' }],
            });

            const files = {
              'inspector-type.html': inspectorHtml, 'edit-form.html': editFormHtml, 'workbench-browser.html': browserHtml, 'call-graph.html': callGraphPageHtml,
              'call-columns.html': callColumnsPageHtml, 'control-flow.html': cfgPageHtml, 'program-listing.html': listingHtml, 'program-hex.html': hexHtml,
            };
            for (const [name, html] of Object.entries(files)) fs.writeFileSync(path.join(snapDir, name), html, 'utf8');
            return files;
          }

          function injectThemeAndShim(rawHtml, theme, dualSwitchThemes = false) {
            const nonceMatch = /style-src 'nonce-([^']+)'/.exec(rawHtml);
            assert(nonceMatch, 'Expected CSP style-src nonce in snapshot HTML');
            const nonce = nonceMatch[1];
            const cssBlock = dualSwitchThemes
              ? `body.vscode-light{${Object.entries(THEMES['light-plus'].vars).map(([k, v]) => `${k}:${v}`).join(';')}}body.vscode-dark{${Object.entries(THEMES['dark-plus'].vars).map(([k, v]) => `${k}:${v}`).join(';')}}`
              : `:root,body{${Object.entries(theme.vars).map(([k, v]) => `${k}:${v}`).join(';')}}`;
            const themeStyle = `<style id="theme-fixture" nonce="${nonce}">${cssBlock}</style>`;
            const shim = `<script nonce="${nonce}">window.__cspViolations=[];document.addEventListener('securitypolicyviolation',e=>window.__cspViolations.push(e.violatedDirective+':'+e.blockedURI));window.acquireVsCodeApi=()=>{let st={};return{getState:()=>st,setState:s=>{st=s},postMessage:()=>{}}};</script>`;
            return rawHtml
              .replace('</head>', `${themeStyle}</head>`)
              .replace('<script nonce=', `${shim}<script nonce=`)
              .replace(/<body class="([^"]*)"/, `<body class="${theme.bodyClass} $1"`)
              .replace(/<body data-/, `<body class="${theme.bodyClass}" data-`);
          }

          const BROWSER_HELPERS = `window.__contrastHelpers=(()=>{const parse=s=>{const m=/^rgba?\\((\\d+),\\s*(\\d+),\\s*(\\d+)(?:,\\s*([\\d.]+))?\\)$/.exec(String(s||'').trim());return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null};const over=(fg,bg)=>[Math.round(fg[0]*fg[3]+bg[0]*(1-fg[3])),Math.round(fg[1]*fg[3]+bg[1]*(1-fg[3])),Math.round(fg[2]*fg[3]+bg[2]*(1-fg[3]))];const lin=v=>{const s=v/255;return s<=0.04045?s/12.92:Math.pow((s+0.055)/1.055,2.4)};const lum=([r,g,b])=>0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);const ratio=(a,b)=>{const l1=lum(a),l2=lum(b);return(Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05)};const effectiveBg=el=>{const chain=[];for(let cur=el;cur&&cur.nodeType===1;cur=cur.parentElement){const c=parse(getComputedStyle(cur).backgroundColor);if(c&&c[3]>0)chain.unshift(c)}let bg=[255,255,255];for(const c of chain)bg=over(c,bg);return bg};const ringColor=bs=>{if(!bs||bs==='none')return null;const matches=bs.match(/rgba?\\([^)]+\\)/g);return matches&&matches.length?parse(matches[matches.length-1]):null};return{parse,over,ratio,effectiveBg,ringColor}})();`;

          async function verifySnapshot(page, name, rawHtml, themeName, theme) {
            const pageErrors = [];
            const onError = err => pageErrors.push(err.stack || err.message || String(err));
            page.on('pageerror', onError);
            try {
              await page.goto('about:blank');
              await page.setContent(injectThemeAndShim(rawHtml, theme), { waitUntil: 'load' });
              await page.waitForFunction(() => document.body.dataset.viewReady === 'true');
              if (name === 'workbench-browser.html') {
                await page.evaluate(() => { document.body.classList.add('show-extra-columns'); document.querySelector('tbody tr.selected')?.focus(); });
              } else if (name === 'program-listing.html') {
                await page.evaluate(() => { const cb = document.getElementById('listing-vars'); cb.checked = true; cb.dispatchEvent(new Event('change')); });
              } else if (name === 'program-hex.html') {
                await page.evaluate(() => { const mm = document.querySelector('.memory-map'); if (mm) mm.open = true; });
              } else if (name === 'call-graph.html') {
                await page.evaluate(() => {
                  document.getElementById('call-search-toggle')?.click();
                  const menu = document.getElementById('call-menu'); if (menu) menu.open = true;
                  document.querySelector('.call-node:not(.is-root)')?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
                });
              } else if (name === 'call-columns.html') {
                await page.evaluate(() => { document.getElementById('call-search-toggle')?.click(); const menu = document.getElementById('call-menu'); if (menu) menu.open = true; });
              } else if (name === 'control-flow.html') {
                await page.evaluate(() => { document.getElementById('cfg-overview-toggle')?.click(); });
              }
              assert.deepEqual(pageErrors, [], `[${themeName}/${name}] pageerror:\n${pageErrors.join('\n')}`);
              assert.deepEqual(await page.evaluate(() => window.__cspViolations), [], `[${themeName}/${name}] CSP violations`);
              const rootCheck = await page.evaluate(() => {
                const rule = document.styleSheets[0].cssRules[0];
                return { inlineStyle: document.documentElement.getAttribute('style'), selector: rule.selectorText, hasGhidraBg: !!rule.style.getPropertyValue('--ghidra-bg').trim() };
              });
              assert.equal(rootCheck.inlineStyle, null, `[${themeName}/${name}] documentElement.style must stay empty`);
              assert.equal(rootCheck.selector, ':root', `[${themeName}/${name}] styleSheets[0].cssRules[0] must be :root`);
              assert(rootCheck.hasGhidraBg, `[${themeName}/${name}] :root must hold solved --ghidra-* properties`);

              const axeRes = await page.evaluate(() => window.axe.run(document, { runOnly: { type: 'rule', values: ['color-contrast'] } }));
              if (axeRes.violations.length > 0) {
                const details = axeRes.violations.flatMap(v => v.nodes.map(n => `${n.html} -> ${n.failureSummary}`)).join('\n');
                assert.fail(`[${themeName}/${name}] axe color-contrast violations:\n${details}`);
              }

              const customFailures = await page.evaluate(snapName => {
                const H = window.__contrastHelpers;
                const failures = [];
                const pageBg = H.effectiveBg(document.body);
                const checkFg = (el, bgRgb, min, label) => {
                  const cs = getComputedStyle(el);
                  const raw = H.parse(cs.color);
                  if (!raw) return;
                  const op = parseFloat(cs.opacity || '1');
                  const fg = H.over([raw[0], raw[1], raw[2], raw[3] * op], bgRgb);
                  const r = H.ratio(fg, bgRgb);
                  if (r + 1e-3 < min) failures.push(`${label}: ratio ${r.toFixed(2)} < ${min}`);
                };
                for (const input of document.querySelectorAll('input[placeholder], textarea[placeholder]')) {
                  if (input.offsetParent === null) continue;
                  const bg = H.effectiveBg(input);
                  const raw = H.parse(getComputedStyle(input, '::placeholder').color);
                  if (raw && H.ratio(H.over(raw, bg), bg) + 1e-3 < 4.5) failures.push(`placeholder(${input.getAttribute('placeholder')})`);
                }
                for (const pressed of document.querySelectorAll('.program-view .icon-button[aria-pressed="true"], .call-topbar [aria-expanded="true"], .call-icon-row [aria-pressed="true"], .cfg-topbar [aria-pressed="true"], .call-direction [aria-pressed="true"]')) {
                  if (pressed.offsetParent === null) continue;
                  const parentBg = H.effectiveBg(pressed.parentElement);
                  const selfBg = H.effectiveBg(pressed);
                  checkFg(pressed, selfBg, 4.5, `pressed-fg(${pressed.id || pressed.className})`);
                  const cs = getComputedStyle(pressed);
                  const ring = H.ringColor(cs.boxShadow) || H.parse(cs.borderTopColor);
                  const fillRatio = H.ratio(selfBg, parentBg);
                  const ringRatio = ring ? H.ratio(H.over(ring, parentBg), parentBg) : 1;
                  if (Math.max(fillRatio, ringRatio) + 1e-3 < 3.0) failures.push(`pressed-indicator(${pressed.id || pressed.className}): ${Math.max(fillRatio, ringRatio).toFixed(2)} < 3.0`);
                }
                for (const sw of document.querySelectorAll('.call-view-switch [aria-pressed="true"]')) {
                  if (sw.offsetParent === null) continue;
                  const parentBg = H.effectiveBg(sw.parentElement);
                  const selfBg = H.effectiveBg(sw);
                  checkFg(sw, selfBg, 4.5, 'call-view-switch-fg');
                  if (H.ratio(selfBg, parentBg) + 1e-3 < 3.0) failures.push('call-view-switch-fill < 3.0');
                }
                if (snapName === 'call-columns.html') {
                  for (const row of document.querySelectorAll('.call-column-row.is-selected')) {
                    const bg = H.effectiveBg(row);
                    for (const el of row.querySelectorAll('.call-column-name, .call-column-addr, .call-column-chevron')) checkFg(el, bg, 4.5, `call-col-sel(${el.className})`);
                  }
                }
                if (snapName === 'program-listing.html') {
                  const selRow = document.querySelector('tr.listing-unit-row.selected');
                  if (selRow) {
                    for (const state of ['selected', 'focused']) {
                      if (state === 'focused') selRow.focus();
                      const bg = H.effectiveBg(selRow);
                      for (const span of selRow.querySelectorAll('.addr, .col-bytes, .tok-mnemonic, .tok-register, .tok-number, .tok-string, .tok-keyword, .tok-symbol, .target-link, .col-comment')) {
                        checkFg(span, bg, 4.5, `listing-${state}(${span.className})`);
                      }
                    }
                  }
                }
                if (snapName === 'program-hex.html') {
                  for (const nullCell of document.querySelectorAll('.hb.is-null')) {
                    const bg = H.effectiveBg(nullCell);
                    const op = parseFloat(getComputedStyle(nullCell).opacity || '1');
                    if (op < 0.99) failures.push(`.hb.is-null opacity ${op} !== 1`);
                    checkFg(nullCell, bg, 4.5, `hex-null(${nullCell.dataset.address})`);
                  }
                  const hexSel = document.querySelector('tr.hex-row.selected');
                  if (hexSel) {
                    hexSel.focus();
                    const bg = H.effectiveBg(hexSel);
                    for (const el of hexSel.querySelectorAll('td.addr, .hb:not(.is-pad):not(.is-selected)')) checkFg(el, bg, 4.5, `hex-row-focused(${el.className})`);
                  }
                }
                if (snapName === 'call-graph.html') {
                  for (const node of document.querySelectorAll('.call-node')) {
                    const fillRgb = H.parse(getComputedStyle(node.querySelector('.call-node-body')).fill);
                    const bg = fillRgb ? H.over(fillRgb, pageBg) : pageBg;
                    for (const txt of node.querySelectorAll('text')) {
                      const tf = H.parse(getComputedStyle(txt).fill);
                      const op = parseFloat(getComputedStyle(txt).opacity || '1');
                      if (H.ratio(H.over([tf[0], tf[1], tf[2], tf[3] * op], bg), bg) + 1e-3 < 4.5) failures.push(`call-node-text(${node.dataset.label})`);
                    }
                    for (const br of node.querySelectorAll('.node-branch')) {
                      const stroke = H.parse(getComputedStyle(br.querySelector('.branch-bar-path')).stroke);
                      const r = H.ratio(H.over(stroke, bg), bg);
                      if (r + 1e-3 < 3.0) failures.push(`node-branch(${node.className.baseVal}, expanded=${br.getAttribute('aria-expanded')}): ${r.toFixed(2)} < 3.0`);
                    }
                  }
                }
                if (snapName === 'control-flow.html') {
                  for (const node of document.querySelectorAll('.graph-node')) {
                    const bodyFill = H.over(H.parse(getComputedStyle(node.querySelector('.block-body')).fill), pageBg);
                    const headFill = H.over(H.parse(getComputedStyle(node.querySelector('.block-header')).fill), bodyFill);
                    for (const t of node.querySelectorAll('.node-title, .cfg-entry-badge')) {
                      if (H.ratio(H.over(H.parse(getComputedStyle(t).fill), headFill), headFill) + 1e-3 < 4.5) failures.push(`cfg-header(${t.className.baseVal})`);
                    }
                    for (const t of node.querySelectorAll('.node-line tspan, .node-subtitle:not(.cfg-entry-badge)')) {
                      if (H.ratio(H.over(H.parse(getComputedStyle(t).fill), bodyFill), bodyFill) + 1e-3 < 4.5) failures.push(`cfg-body(${t.className.baseVal || 'tspan'})`);
                    }
                  }
                }
                return failures;
              }, name);
              assert.deepEqual(customFailures, [], `[${themeName}/${name}] contrast failures:\n${customFailures.join('\n')}`);

              if (name === 'call-graph.html') {
                await page.locator('.call-node:not(.is-root):not(.selected)').first().hover({ force: true });
                const hoverFailures = await page.evaluate(() => {
                  const H = window.__contrastHelpers;
                  const pageBg = H.effectiveBg(document.body);
                  const node = document.querySelector('.call-node:not(.is-root):not(.selected):hover');
                  if (!node) return [];
                  const bg = H.over(H.parse(getComputedStyle(node.querySelector('.call-node-body')).fill), pageBg);
                  return Array.from(node.querySelectorAll('.node-branch')).flatMap(br => {
                    const r = H.ratio(H.over(H.parse(getComputedStyle(br.querySelector('.branch-bar-path')).stroke), bg), bg);
                    return r + 1e-3 < 3.0 ? [`hover node-branch ${r.toFixed(2)} < 3.0`] : [];
                  });
                });
                assert.deepEqual(hoverFailures, [], `[${themeName}/call-graph.html] hover branch contrast failed`);
              }
            } finally {
              page.off('pageerror', onError);
            }
          }

          async function run() {
            assert(
              pageStylesMod.pageStyles.includes('var(--ghidra-fg,var(--vscode-foreground))') &&
              pageStylesMod.pageStyles.includes('var(--ghidra-input-placeholder,var(--vscode-input-placeholderForeground))'),
              'page-styles.ts must preserve static --vscode-* fallbacks'
            );
            const snapshots = await buildSnapshots();
            const chromePath = [process.env.CHROME_PATH, '/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser']
              .filter(Boolean)
              .find(p => fs.existsSync(p));
            const browser = await chromium.launch({ executablePath: chromePath || undefined, headless: true, args: ['--no-sandbox', '--disable-gpu'] });
            try {
              const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
              await context.addInitScript({ content: axe.source + '\n' + BROWSER_HELPERS });
              const page = await context.newPage();
              for (const [themeName, theme] of Object.entries(THEMES)) {
                for (const [name, rawHtml] of Object.entries(snapshots)) {
                  await verifySnapshot(page, name, rawHtml, themeName, theme);
                }
                console.log(`PASS theme=${themeName} (${Object.keys(snapshots).length} snapshots)`);
              }

              await page.goto('about:blank');
              await page.setContent(injectThemeAndShim(snapshots['program-listing.html'], THEMES['light-plus'], true), { waitUntil: 'load' });
              const beforeBg = await page.evaluate(() => document.styleSheets[0].cssRules[0].style.getPropertyValue('--ghidra-bg').trim());
              await page.evaluate(() => { document.body.classList.remove('vscode-light'); document.body.classList.add('vscode-dark'); });
              await page.waitForFunction(prev => document.styleSheets[0].cssRules[0].style.getPropertyValue('--ghidra-bg').trim() !== prev, beforeBg);
              const switchCheck = await page.evaluate(async () => {
                const axeRes = await window.axe.run(document, { runOnly: { type: 'rule', values: ['color-contrast'] } });
                return { violations: window.__cspViolations, inlineStyle: document.documentElement.getAttribute('style'), axeCount: axeRes.violations.length };
              });
              assert.deepEqual(switchCheck, { violations: [], inlineStyle: null, axeCount: 0 }, 'Live theme switch failed');
              console.log('PASS live theme switch + document.styleSheets[0] :root + zero CSP violations');
              await context.close();

              const noCanvasCtx = await browser.newContext({ viewport: { width: 1280, height: 900 } });
              await noCanvasCtx.addInitScript({
                content: `HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},getImageData(){return{data:new Uint8ClampedArray([0,0,0,0])}},set fillStyle(_v){}});\n` + axe.source + '\n' + BROWSER_HELPERS,
              });
              const noCanvasPage = await noCanvasCtx.newPage();
              await verifySnapshot(noCanvasPage, 'program-listing.html', snapshots['program-listing.html'], 'low-contrast-srgb', THEMES['low-contrast-srgb']);
              await verifySnapshot(noCanvasPage, 'call-graph.html', snapshots['call-graph.html'], 'low-contrast-srgb', THEMES['low-contrast-srgb']);
              console.log('PASS 2D canvas readback restriction fallback');
              await noCanvasCtx.close();

              const fcCtx = await browser.newContext({ viewport: { width: 1280, height: 900 }, forcedColors: 'active' });
              const fcPage = await fcCtx.newPage();
              await fcPage.setContent(injectThemeAndShim(snapshots['call-graph.html'], THEMES['light-plus']), { waitUntil: 'load' });
              const fcResult = await fcPage.evaluate(() => {
                const probe = document.createElement('div');
                document.body.appendChild(probe);
                const sysColor = kw => {
                  const s = document.styleSheets[0];
                  const idx = s.insertRule(`#__fc_probe{color:${kw}}`, s.cssRules.length);
                  probe.id = '__fc_probe';
                  const val = getComputedStyle(probe).color;
                  s.deleteRule(idx);
                  return val;
                };
                const expected = { CanvasText: sysColor('CanvasText'), Highlight: sysColor('Highlight'), HighlightText: sysColor('HighlightText'), ButtonText: sysColor('ButtonText') };
                probe.remove();
                const rule = document.styleSheets[0].cssRules[0];
                let ghidraCount = 0;
                for (let i = 0; i < rule.style.length; i++) if (rule.style[i].startsWith('--ghidra-')) ghidraCount++;
                return {
                  ghidraCount, expected, violations: window.__cspViolations,
                  actual: {
                    nodeStroke: getComputedStyle(document.querySelector('.call-node:not(.is-root) .call-node-body')).stroke,
                    rootFill: getComputedStyle(document.querySelector('.call-node.is-root .call-node-body')).fill,
                    rootTextFill: getComputedStyle(document.querySelector('.call-node.is-root text')).fill,
                    branchColor: getComputedStyle(document.querySelector('.call-node .node-branch')).color,
                  },
                };
              });
              assert.equal(fcResult.ghidraCount, 0);
              assert.deepEqual(fcResult.actual, {
                nodeStroke: fcResult.expected.CanvasText,
                rootFill: fcResult.expected.Highlight,
                rootTextFill: fcResult.expected.HighlightText,
                branchColor: fcResult.expected.ButtonText,
              });
              assert.deepEqual(fcResult.violations, []);
              console.log('PASS forced-colors: active bypass');
              await fcCtx.close();
            } finally {
              await browser.close();
            }
          }

          run().catch(err => { console.error(err); process.exit(1); });
          EOF
          REPO_ROOT="$PWD" NODE_PATH=/tmp/ghidra-contrast/node_modules node /tmp/ghidra-contrast/audit.cjs

      - name: Clean temporary contrast artifacts
        if: always()
        run: rm -rf /tmp/ghidra-contrast

  build:
    name: release (${{ matrix.target }})
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: ghidra-lsp-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: ghidra-lsp-macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: ghidra-lsp-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ghidra-lsp-linux-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: ghidra-lsp-windows-x86_64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: ghidra-lsp-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check repository rules
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask check

      - name: Clippy
        run: cargo clippy --all-targets --workspace --target ${{ matrix.target }} --locked -- -D warnings

      - name: Documentation
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

      - name: Build release executable
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --release --target ${{ matrix.target }} --locked --bin ghidra-lsp

      - name: Prepare executable artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ghidra-lsp${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/${{ matrix.artifact }}"

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Collect dependency licenses
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo xtask collect-licenses > dist/THIRD_PARTY_LICENSES.txt

      - name: Upload dependency licenses
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: dist/THIRD_PARTY_LICENSES.txt
          overwrite: true
          if-no-files-found: error

  vscode:
    name: VS Code extension
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Verify extension version
        run: |
          manifest_version="$(jq -r '."."' .release-please-manifest.json)"
          test "$(jq -r .version editors/vscode/package.json)" = "$manifest_version"
          test "$(jq -r .version editors/vscode/package-lock.json)" = "$manifest_version"
          test "$(jq -r '.packages[""].version' editors/vscode/package-lock.json)" = "$manifest_version"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Typecheck and compile extension
        working-directory: editors/vscode
        run: |
          npm run check
          npm run compile

      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          version="$(jq -r .version package.json)"
          npx --yes --package=@vscode/vsce@^4.1.1 vsce package --out "ghidra-lsp-${version}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode/ghidra-lsp-*.vsix
          overwrite: true
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [release-please, build, security-audit, contrast, vscode]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
      # The npm and Visual Studio Marketplace trusted publishers use the GitHub OIDC token.
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Verify release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(jq -r '."."' .release-please-manifest.json)" = "$RELEASE_VERSION"
          metadata="$(cargo metadata --no-deps --locked --format-version 1)"
          for package in ghidra-lsp xtask; do
            actual="$(jq -r --arg package "$package" \
              '.packages[] | select(.name == $package) | .version' <<< "$metadata")"
            test "$actual" = "$RELEASE_VERSION"
          done
          test "$(jq -r .version npm/cli/package.json)" = "$RELEASE_VERSION"
          while IFS= read -r dep_version; do
            test "$dep_version" = "$RELEASE_VERSION"
          done < <(jq -r '.optionalDependencies[]' npm/cli/package.json)
          test "$(jq -r .version editors/vscode/package.json)" = "$RELEASE_VERSION"
          test "$(jq -r .version editors/vscode/package-lock.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.packages[""].version' editors/vscode/package-lock.json)" = "$RELEASE_VERSION"

      - name: Download release executables
        uses: actions/download-artifact@v4
        with:
          pattern: ghidra-lsp-*
          path: dist
          merge-multiple: true

      - name: Download dependency licenses
        uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
          path: dist

      - name: Download VS Code extension
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: vsix

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          assets=(dist/ghidra-lsp-*)
          test "${#assets[@]}" -eq 6
          for asset in "${assets[@]}"; do test -s "$asset"; done
          vsix="vsix/ghidra-lsp-${RELEASE_VERSION}.vsix"
          test -s "$vsix"
          {
            (cd dist && sha256sum ghidra-lsp-*)
            (cd vsix && sha256sum "ghidra-lsp-${RELEASE_VERSION}.vsix")
          } > dist/SHA256SUMS
          cp LICENSE dist/LICENSE
          gh release upload "$RELEASE_TAG" "${assets[@]}" "$vsix" dist/SHA256SUMS dist/LICENSE dist/THIRD_PARTY_LICENSES.txt --clobber

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # The npm trusted publisher feature needs npm 11.5.1 or later.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Make npm packages
        run: cargo xtask npm-pack --dist dist --out npm-dist

      - name: Publish npm packages
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # Publish the platform packages before the main package that needs them.
          # Skip a package that has this version already, so that a failed run can run again.
          platforms=()
          for directory in npm-dist/*/; do
            [ "$directory" = npm-dist/cli/ ] || platforms+=("$directory")
          done
          test "${#platforms[@]}" -eq 6
          for directory in "${platforms[@]}" npm-dist/cli/; do
            name="$(jq -r .name "$directory/package.json")"
            if npm view "$name@$RELEASE_VERSION" version > /dev/null 2>&1; then
              echo "$name@$RELEASE_VERSION is on npm already"
              continue
            fi
            npm publish "$directory" --access public
          done

      - name: Publish VS Code extension to Visual Studio Marketplace
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: npx --yes --package=@vscode/vsce@^4.1.1 vsce publish --oidc --packagePath "vsix/ghidra-lsp-${RELEASE_VERSION}.vsix" --skip-duplicate

      - name: Publish VS Code extension to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set; skipping Open VSX publish."
            exit 0
          fi
          if curl -fsSL "https://open-vsx.org/api/byteland-app/ghidra-lsp/${RELEASE_VERSION}" 2>/dev/null | jq -e --arg version "$RELEASE_VERSION" '.version == $version' > /dev/null 2>&1; then
            echo "byteland-app.ghidra-lsp@${RELEASE_VERSION} already exists on Open VSX; skipping."
            exit 0
          fi
          npx --yes ovsx create-namespace byteland-app -p "$OVSX_PAT" || true
          npx --yes ovsx publish "vsix/ghidra-lsp-${RELEASE_VERSION}.vsix" -p "$OVSX_PAT"

      - name: Make release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api --method PATCH "$release_api" -F draft=false -f make_latest=legacy --silent
