                '--vscode-errorForeground': 'rgb(206 118 112)', '--vscode-inputValidation-errorBorder': 'rgb(212 122 116)', '--vscode-editorWarning-foreground': 'hsl(46 68% 54%)',
                '--vscode-testing-iconPassed': 'color(srgb 0.45 0.72 0.5)', '--vscode-symbolIcon-keywordForeground': 'color(srgb 0.42 0.6 0.88)',
