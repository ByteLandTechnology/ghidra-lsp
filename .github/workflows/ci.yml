              scopeSummary: '2 strings', scope: 'Showing 2 strings in .rodata', state: { kind: 'strings', md5, selected: 'ram:00402000' },
              body: workbenchPage.table(['Address', 'Length', 'Type', 'Value'], [
                { cells: ['ram:00402000', '12', 'ds', '"hello world"'], address: 'ram:00402000', kind: 'data', detail: 'ds · 12 bytes' },
