                '--vscode-button-foreground': '#ffffff', '--vscode-button-hoverBackground': '#0062a3', '--vscode-button-secondaryBackground': '#5f6a79',
                '--vscode-button-secondaryForeground': '#ffffff', '--vscode-button-secondaryHoverBackground': '#4c5561', '--vscode-menu-background': '#ffffff',
