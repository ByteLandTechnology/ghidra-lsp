              { id: 'b1', title: '00401010', address: 'ram:00401010', entry: 'ram:00401000', lines: ['LEA RDI, ["usage"]', 'CALL puts'] },
              { id: 'b2', title: '00401020', address: 'ram:00401020', entry: 'ram:00401000', subtitle: 'Empty return block', lines: [] },
            ], [{ from: 'b0', to: 'b2', label: 'CONDITIONAL_JUMP' }, { from: 'b0', to: 'b1', label: 'FALL_THROUGH' }]);
            const cfgPageHtml = workbenchPage.page({
              title: 'Control flow', subtitle: 'main · app.bin', graph: true, controlFlow: true, actions: true, viewKind: 'controlFlow',
              scope: '3 basic blocks', state: { kind: 'controlFlow', md5, entry: 'ram:00401000', selected: 'ram:00401010' }, body: cfgBody,
            });

            const blockInfo = { name: '.text', start: 'ram:00401000', end: 'ram:00401fff', length: 4096, initialized: true, read: true, write: false, execute: true, permissions: 'r-x', kind: 'ram', comment: 'code' };
            const bssInfo = { name: '.bss', start: 'ram:00403000', end: 'ram:004030ff', length: 256, initialized: false, read: true, write: true, execute: false, permissions: 'rw-' };
            const listingItems = [
              {
                kind: 'instruction', address: 'ram:00401000', byteLength: 4, bytesText: '48 89 e5 90', bytesShort: '48 89 e5 90',
                mnemonic: 'MOV', operandsText: 'RBP, qword ptr [RSP + 0x10], "fmt", symbol_fn', entry: 'ram:00401000', functionName: 'demo::main',
                blockHeader: blockInfo, plateComment: 'Entry point banner',
                functionHeader: { displaySignature: 'int demo::main(int argc, char **argv)', rawSignature: 'int main(int argc, char **argv)', callingConvention: '__sysv', flags: ['entry'], variables: [{ kind: 'param', dataType: 'int', name: 'argc', storage: 'EDI', rawStorage: 'EDI:4' }] },
                labels: [{ name: 'demo::main', fullTooltip: 'demo::main' }], xrefTotal: 2,
                xrefs: [{ from: 'ram:00400900', label: '_start+0x14', suffix: '(c)', type: 'CALL', navigable: true }, { from: 'EXTERNAL:00000001', label: 'entry', suffix: '', type: 'ENTRY', navigable: false }],
