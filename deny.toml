# cargo-deny policy for advisories, licenses, bans, and sources.
# Run it with `cargo deny --locked --workspace check`.

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "rmcp depends on chrono, which is unmaintained and has no patched version" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "block-buffer@0.10.4", reason = "md-5 0.10 uses digest 0.10, while rmcp 3.9 uses sha2 0.11" },
  { crate = "crypto-common@0.1.7", reason = "md-5 0.10 uses digest 0.10, while rmcp 3.9 uses sha2 0.11" },
  { crate = "digest@0.10.7", reason = "md-5 0.10 uses digest 0.10, while rmcp 3.9 uses sha2 0.11" },
  { crate = "hashbrown@0.14.5", reason = "dashmap 6 in tower-lsp-server 0.23 uses hashbrown 0.14, while indexmap 2 uses 0.17" },
  { crate = "syn@2.0.119", reason = "tracing-attributes 0.1 uses syn 2, while serde_derive and tokio-macros use syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
